const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(V)},key,u(C));
  const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
function launch(p,pw){
  try{sessionStorage.setItem('hn3bi.pw',pw);sessionStorage.setItem('hn3bi.in','1')}catch(e){}
  const of=window.fetch.bind(window);
  window.fetch=(r,o)=>{const s=typeof r==='string'?r.replace(/^\.?\//,''):'';const k=s.split('?')[0];
    if(p.files[k]!=null)return Promise.resolve(new Response(p.files[k],{status:200,headers:{'Content-Type':'application/json'}}));return of(r,o)};
  document.open();document.write(p.html);document.close();
}
const f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
f.onsubmit=async e=>{e.preventDefault();go.disabled=true;go.textContent='Đang mở…';err.textContent='';
  try{launch(await open_(pw.value),pw.value)}catch(x){err.textContent='Sai mật khẩu – vui lòng thử lại.';go.disabled=false;go.textContent='Vào hệ thống';pw.value='';pw.focus()}};
(async()=>{let s=null;try{s=sessionStorage.getItem('hn3bi.pw')}catch(e){}if(s){try{launch(await open_(s),s)}catch(e){}}})();
</script></body></html>
